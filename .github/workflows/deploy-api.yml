name: Deploy API

on:
    push:
        branches:
            - main
        paths:
            - "api/**"
    workflow_dispatch:


jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
    
            - name: Setup .NET 10
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: "10.x"
    
            - name: Restore dependencies
              run: dotnet restore
    
            - name: Build
              run: dotnet build --no-restore --configuration Release
