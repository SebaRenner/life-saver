name: Deploy API

on:
    push:
        branches:
            - main
        paths:
            - "api/**"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: api

        steps:
            - name: Checkout
              uses: actions/checkout@v4
    
            - name: Setup .NET 10
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: "10.x"
    
            - name: Restore dependencies
              run: dotnet restore
    
            - name: Build
              run: dotnet build --no-restore --configuration Release

            - name: Publish
              run: dotnet publish LifeSaver.API/LifeSaver.API.csproj --no-build --configuration Release --output ./publish

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: api
                path: api/publish
    
    infra:
        runs-on: ubuntu-latest
        permissions:
          id-token: write
          contents: read

        defaults:
          run:
            working-directory: terraform

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Azure Login
              uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform Init
              run: |
                terraform init \
                  -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
                  -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
                  -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
                  -backend-config="key=lifesaver.tfstate" \
                  -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"

            - name: Terraform Plan
              run: terraform plan -out=tfplan

            - name: Terraform Apply
              run: terraform apply -auto-approve tfplan

    deploy:
        runs-on: ubuntu-latest
        needs: [build, infra]
        permissions:
          id-token: write
          contents: read

        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                name: api
                path: ./publish

            - name: Azure Login
              uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Deploy to Azure Web App
              uses: azure/webapps-deploy@v3
              with:
                app-name: app-life-saver
                package: ./publish