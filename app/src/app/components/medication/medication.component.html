<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="mandatory-fields">
    <mat-form-field appearance="outline">
      <mat-label>Medication name</mat-label>
      <input matInput formControlName="medicationName" placeholder="Enter medication name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Dosage</mat-label>
      <input matInput type="number" formControlName="dosageAmount" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Unit</mat-label>
      <mat-select formControlName="dosageUnit">
        @for (unit of dosageUnits; track unit) {
          <mat-option [value]="unit">{{ dosageUnitLabels[unit] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <div class="daily-schedule" formGroupName="dailySchedule">
      <mat-form-field appearance="outline">
        <mat-label>Morning</mat-label>
        <input matInput type="number" formControlName="morning" placeholder="0" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Afternoon</mat-label>
        <input matInput type="number" formControlName="afternoon" placeholder="0" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Evening</mat-label>
        <input matInput type="number" formControlName="evening" placeholder="0" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Night</mat-label>
        <input matInput type="number" formControlName="night" placeholder="0" />
      </mat-form-field>
    </div>
  </div>

  <mat-form-field appearance="outline">
    <mat-label>Indication</mat-label>
    <textarea
      matInput
      formControlName="indication"
      rows="1"
      [maxlength]="maxIndicationLength"
      placeholder="Why are you taking this medication?"
    >
    </textarea>
  </mat-form-field>
  
  @if (!form.disabled) {
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
      Add
    </button>
  } @else {
    <button mat-stroked-button color="warn" type="button" (click)="removePrescription.emit()">
      Remove
    </button>
  }
</form>
